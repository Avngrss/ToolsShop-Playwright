name: Playwright E2E & API Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      cross_browser:
        description: "Run tests on all browsers (chromium, firefox, webkit)?"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

env:
  CI: true
  BASE_URL: ${{ vars.BASE_URL }}

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npx playwright test --project=api --reporter=line,allure-playwright
        env:
          API_URL: ${{ secrets.API_URL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}

          BASE_URL: ${{ vars.BASE_URL }}
          TEST_USER_EMAIL: ${{ vars.TEST_USER_EMAIL }}
          TEST_ADMIN_EMAIL: ${{ vars.TEST_ADMIN_EMAIL }}
          QASE_BASE_URL: ${{ vars.QASE_BASE_URL }}

      - name: Upload API results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-allure-results
          path: allure-results/
          retention-days: 7
          if-no-files-found: warn

  ui-tests:
    name: UI Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ matrix.browser }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        if: ${{ github.event.inputs.cross_browser == 'true' || matrix.browser == 'chromium' }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run UI tests
        if: ${{ github.event.inputs.cross_browser == 'true' || matrix.browser == 'chromium' }}
        run: npx playwright test --project=ui-${{ matrix.browser }} --reporter=line,allure-playwright
        env:
          API_URL: ${{ secrets.API_URL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}

          # 📦 Variables
          BASE_URL: ${{ vars.BASE_URL }}
          TEST_USER_EMAIL: ${{ vars.TEST_USER_EMAIL }}
          TEST_ADMIN_EMAIL: ${{ vars.TEST_ADMIN_EMAIL }}
          QASE_BASE_URL: ${{ vars.QASE_BASE_URL }}

      - name: Upload UI results
        if: ${{ always() && (github.event.inputs.cross_browser == 'true' || matrix.browser == 'chromium') }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-allure-results-${{ matrix.browser }}
          path: allure-results/
          retention-days: 7
          if-no-files-found: warn

  generate-report:
    name: Generate Allure Report
    runs-on: ubuntu-latest
    needs: [api-tests, ui-tests]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: merged-allure-results/
          pattern: "*-allure-results"
          merge-multiple: true

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Generate Allure Report
        run: allure generate merged-allure-results --clean -o allure-report

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-final
          path: allure-report/
          retention-days: 30
          if-no-files-found: warn
